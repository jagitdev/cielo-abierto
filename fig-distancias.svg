<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="system-ui,sans-serif"><rect width="900" height="300" rx="16" fill="#0e1430"/><line x1="40" y1="150" x2="860" y2="150" stroke="#4b5683" stroke-width="2"/><circle cx="40" cy="150" r="12" fill="#3d7bd9"/><text x="40" y="190" text-anchor="middle" fill="#9fb3e8" font-size="14">Tierra</text><circle cx="150" cy="150" r="14" fill="#e9e4d4"/><text x="150" y="122" text-anchor="middle" fill="#e8ecff" font-size="16" font-weight="700">Luna</text><text x="150" y="190" text-anchor="middle" fill="#c9cfe6" font-size="14">1,3 s luz</text><circle cx="280" cy="150" r="22" fill="#ffd27a"/><text x="280" y="114" text-anchor="middle" fill="#e8ecff" font-size="16" font-weight="700">Sol</text><text x="280" y="198" text-anchor="middle" fill="#c9cfe6" font-size="14">8 min 20 s luz</text><circle cx="520" cy="150" r="10" fill="#ff8a6b"/><text x="520" y="126" text-anchor="middle" fill="#e8ecff" font-size="16" font-weight="700">Próxima Centauri</text><text x="520" y="186" text-anchor="middle" fill="#c9cfe6" font-size="14">4,2 años luz</text><circle cx="770" cy="150" r="26" fill="#a98bff"/><text x="770" y="110" text-anchor="middle" fill="#e8ecff" font-size="16" font-weight="700">Andrómeda</text><text x="770" y="202" text-anchor="middle" fill="#c9cfe6" font-size="14">2,5 millones de años luz</text><text x="450" y="275" text-anchor="middle" fill="#7d88b5" font-size="13">Escala logarítmica: cada salto es muchísimo mayor que el anterior</text></svg>